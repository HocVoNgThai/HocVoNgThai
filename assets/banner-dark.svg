<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="t d">
  <title id="t">Thai Hoc - Security Engineer</title>
  <desc id="d">Security R&amp;D at SNP. Profile banner in the Night OS theme of thiscooking.site.</desc>
  <style>
    .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .2s; } .d3 { animation-delay: .35s; } .d4 { animation-delay: .5s; }
    .cover { transform-box: fill-box; transform-origin: 100% 50%; animation: type 0.9s steps(16, end) both; }
    .c1 { animation-delay: .9s; } .c2 { animation-delay: 1.9s; } .c3 { animation-delay: 2.9s; }
    .key { animation: fade .3s ease-out both; }
    .k1 { animation-delay: .8s; } .k2 { animation-delay: 1.8s; } .k3 { animation-delay: 2.8s; } .k4 { animation-delay: 3.8s; }
    .caret { animation: fade .01s linear 3.9s both, blink 1.1s steps(1, end) 3.9s infinite; }
    .bar { transform-box: fill-box; transform-origin: 50% 0%; animation: grow .6s cubic-bezier(.2,.7,.2,1) .1s both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes type { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .cover, .key, .bar { animation: none; }
      .cover { display: none; }
      .caret { animation: none; }
    }
  </style>
  <rect width="1000" height="280" rx="12" fill="#101214"/>
  <rect x="0.5" y="0.5" width="999" height="279" rx="11.5" fill="none" stroke="#2c3138"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text class="rise d1" x="48" y="84" font-size="13" letter-spacing="2.6" fill="#7cd4f5">SECURITY ENGINEER</text>
  </g>
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text class="rise d2" x="46" y="156" font-size="68" font-weight="700" letter-spacing="-1.5" fill="#e8eaed">Thai Hoc</text>
    <text class="rise d3" x="48" y="198" font-size="24" fill="#9aa1a8">Security R&amp;D at SNP</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text class="rise d4" x="48" y="238" font-size="13" fill="#9aa1a8">github.com/HocVoNgThai</text>
  </g>

  <g>
    <rect x="596" y="40" width="356" height="200" rx="8" fill="#181b1f" stroke="#2c3138"/>
    <path d="M596 48a8 8 0 0 1 8-8h340a8 8 0 0 1 8 8v24H596z" fill="#0a0b0d"/>
    <rect class="bar" x="596" y="40" width="6" height="32" fill="#ffb224"/>
    <line x1="596" y1="72.5" x2="952" y2="72.5" stroke="#2c3138"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
      <text x="620" y="61" font-size="12" letter-spacing="1.8" fill="#9aa1a8">IDENTITY</text>

      <text class="key k1" x="620" y="112" fill="#9aa1a8">role</text>
      <text x="694" y="112" fill="#e8eaed">security engineer</text>
      <rect class="cover c1" x="690" y="96" width="256" height="22" fill="#181b1f"/>

      <text class="key k2" x="620" y="148" fill="#9aa1a8">team</text>
      <text x="694" y="148" fill="#e8eaed">security R&amp;D, SNP</text>
      <rect class="cover c2" x="690" y="132" width="256" height="22" fill="#181b1f"/>

      <text class="key k3" x="620" y="184" fill="#9aa1a8">site</text>
      <text x="694" y="184" fill="#e8eaed">thiscooking.site</text>
      <rect class="cover c3" x="690" y="168" width="256" height="22" fill="#181b1f"/>

      <text class="key k4" x="620" y="220" fill="#7cd4f5">$</text>
      <rect class="caret" x="638" y="208" width="9" height="16" fill="#ffb224"/>
    </g>
  </g>
</svg>
